<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TextRefine - Sanitizer &amp; Previewer</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "tertiary": "#943700",
            "tertiary-fixed-dim": "#ffb596",
            "surface-container-high": "#dce9ff",
            "on-secondary-fixed-variant": "#005236",
            "primary-container": "#2563eb",
            "outline": "#737686",
            "tertiary-container": "#bc4800",
            "surface-tint": "#0053db",
            "error": "#ba1a1a",
            "outline-variant": "#c3c6d7",
            "on-secondary-fixed": "#002113",
            "on-primary-container": "#eeefff",
            "secondary-container": "#6cf8bb",
            "on-error-container": "#93000a",
            "on-surface-variant": "#434655",
            "surface-dim": "#cbdbf5",
            "on-primary-fixed": "#00174b",
            "surface-container": "#e5eeff",
            "on-primary": "#ffffff",
            "on-error": "#ffffff",
            "background": "#f8f9ff",
            "surface-variant": "#d3e4fe",
            "secondary": "#006c49",
            "on-tertiary": "#ffffff",
            "on-secondary-container": "#00714d",
            "inverse-surface": "#213145",
            "secondary-fixed-dim": "#4edea3",
            "on-tertiary-fixed-variant": "#7d2d00",
            "surface-container-low": "#eff4ff",
            "surface": "#f8f9ff",
            "on-tertiary-fixed": "#360f00",
            "inverse-on-surface": "#eaf1ff",
            "on-background": "#0b1c30",
            "surface-container-highest": "#d3e4fe",
            "primary-fixed-dim": "#b4c5ff",
            "primary": "#004ac6",
            "secondary-fixed": "#6ffbbe",
            "primary-fixed": "#dbe1ff",
            "on-surface": "#0b1c30",
            "on-secondary": "#ffffff",
            "error-container": "#ffdad6",
            "tertiary-fixed": "#ffdbcd",
            "surface-container-lowest": "#ffffff",
            "surface-bright": "#f8f9ff",
            "on-primary-fixed-variant": "#003ea8",
            "on-tertiary-container": "#ffede6",
            "inverse-primary": "#b4c5ff",
            "primaryHover": '#1D4ED8',
            "textMain": '#1e293b',
            "textMuted": '#64748b'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: {
            'md': '0.25rem',
            'lg': '0.5rem',
          }
        }
      }
    }
  </script>
  <style data-purpose="custom-utilities">
    body {
      background-color: #eef2f6;
      color: #1e293b;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }

    .pane-textarea:focus {
      outline: none;
      box-shadow: inset 0 0 0 1px #004ac6;
    }
  </style>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
</head>

<body class="min-h-screen flex flex-col font-sans p-4 md:p-8">
  <!-- BEGIN: MainContainer -->
  <div
    class="max-w-[1400px] w-full mx-auto bg-white rounded-lg shadow-sm border border-outline-variant flex flex-col overflow-hidden h-[calc(100vh-4rem)]">
    <!-- BEGIN: TopToolbar -->
    <header class="flex items-end justify-between px-4 border-b border-outline-variant bg-white pt-3">
      <!-- Left Controls -->
      <div class="flex items-end space-x-1 h-full">
        <div class="flex items-end gap-px h-full mr-2">
          <div aria-selected="true"
            class="group relative flex items-center gap-2 px-3 py-2 min-w-[80px] rounded-t-md cursor-pointer transition-all duration-200 text-[10px] font-semibold uppercase tracking-wider shrink-0 bg-white dark:bg-slate-900 text-primary dark:text-inverse-primary shadow-[0_-2px_8px_-2px_rgba(0,0,0,0.08)] z-10 border-t border-x border-outline-variant border-b-white dark:border-b-slate-900"
            role="tab">System Default</div>
          <div aria-selected="false"
            class="group relative flex items-center gap-2 px-3 py-2 min-w-[80px] rounded-t-md cursor-pointer transition-all duration-200 text-[10px] font-semibold uppercase tracking-wider shrink-0 text-gray-400 dark:text-slate-500 hover:bg-gray-50 dark:hover:bg-slate-800/50 hover:text-gray-600 dark:hover:text-slate-300"
            role="tab">
            Markdown
          </div>
        </div>
        <button
          class="p-1.5 rounded-md text-primary dark:text-inverse-primary hover:bg-primary-fixed dark:hover:bg-slate-800 transition-colors"
          title="More Options">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </button>
      </div>
      <!-- Right Tabs -->
      <div class="flex items-center space-x-1 relative -mb-[1px]">
        <div class="flex items-end gap-px overflow-x-auto tabs-scrollbar flex-grow py-0.5">
          <div aria-selected="false"
            class="group relative flex items-center gap-2 px-3 py-2 min-w-[100px] flex-1 max-w-[180px] rounded-t-md cursor-pointer transition-all duration-200 text-xs font-medium shrink-0 text-gray-400 dark:text-slate-500 hover:bg-gray-50 dark:hover:bg-slate-800/50 hover:text-gray-600 dark:hover:text-slate-300"
            role="tab" tabindex="0">
            <span class="truncate flex-grow pointer-events-none">Tab 1</span>
            <button aria-label="Close tab"
              class="p-0.5 rounded-full hover:bg-gray-200 dark:hover:bg-slate-800 transition-colors shrink-0 opacity-0 group-hover:opacity-60">
              <svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewbox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg">
                <line x1="18" x2="6" y1="6" y2="18"></line>
                <line x1="6" x2="18" y1="6" y2="18"></line>
              </svg>
            </button>
          </div>
          <div aria-selected="true"
            class="group relative flex items-center gap-2 px-3 py-2 min-w-[100px] flex-1 max-w-[180px] rounded-t-md cursor-pointer transition-all duration-200 text-xs font-medium shrink-0 bg-white dark:bg-slate-900 text-primary dark:text-inverse-primary shadow-[0_-2px_8px_-2px_rgba(0,0,0,0.08)] z-10 border-t border-x border-outline-variant border-b border-b-white dark:border-b-slate-900"
            role="tab" tabindex="0">
            <span class="truncate flex-grow pointer-events-none">Tab 2</span>
            <button aria-label="Close tab"
              class="p-0.5 rounded-full hover:bg-gray-200 dark:hover:bg-slate-800 transition-colors shrink-0 opacity-80 hover:opacity-100">
              <svg fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewbox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg">
                <line x1="18" x2="6" y1="6" y2="18"></line>
                <line x1="6" x2="18" y1="6" y2="18"></line>
              </svg>
            </button>
          </div>
          <button aria-label="Add new tab"
            class="p-1.5 ml-1 mb-1 rounded-md text-gray-400 dark:text-slate-500 hover:bg-white dark:hover:bg-slate-800 hover:text-primary dark:hover:text-inverse-primary hover:shadow-sm transition-all duration-300 shrink-0"
            title="New Tab">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <line x1="12" x2="12" y1="5" y2="19"></line>
              <line x1="5" x2="19" y1="12" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <!-- END: TopToolbar -->
    <!-- BEGIN: Workspace Area -->
    <main class="flex-1 bg-white overflow-hidden flex">
      <div class="flex-1 flex w-full">
        <!-- Input Pane -->
        <section class="flex-1 flex flex-col relative border-r border-outline-variant" data-purpose="input-pane">
          <textarea
            class="flex-1 w-full p-4 font-mono text-sm resize-none border-none pane-textarea custom-scrollbar text-textMain placeholder-textMuted"
            placeholder="Paste or type text here..."></textarea>
          <!-- Input Action Bar -->
          <div class="absolute bottom-4 right-4 flex items-center space-x-2">
            <button
              class="p-2 border border-outline-variant rounded-md bg-white text-textMuted hover:bg-gray-50 hover:text-textMain transition-colors shadow-sm"
              title="Paste"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                  stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                <rect height="4" rx="1" ry="1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="8"
                  x="8" y="2"></rect>
              </svg></button>
            <button
              class="bg-primary text-white px-5 py-2 rounded-md text-sm font-semibold hover:bg-primaryHover transition-colors shadow-sm">
              Sanitize
            </button>
          </div>
        </section>
        <!-- Output Pane -->
        <section class="flex-1 flex flex-col relative" data-purpose="output-pane">
          <!-- Top Search/Action Icon -->
          <div class="absolute top-4 right-4">
            <button
              class="p-2 border border-outline-variant rounded-md bg-white text-textMuted hover:bg-gray-50 hover:text-textMain transition-colors shadow-sm"
              title="Search">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2"></path>
              </svg>
            </button>
          </div>
          <div class="flex-1 w-full p-4 font-mono text-sm overflow-y-auto custom-scrollbar text-textMuted">
            Sanitized output appears here.
          </div>
          <!-- Output Action Bar -->
          <div class="absolute bottom-4 right-4 flex items-center space-x-2">
            <button
              class="p-2 border border-outline-variant rounded-md bg-white text-textMuted hover:bg-gray-50 hover:text-textMain transition-colors shadow-sm"
              title="Copy">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                  stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
              </svg>
            </button>
            <button
              class="p-2 border border-outline-variant rounded-md bg-white text-textMuted hover:bg-gray-50 hover:text-textMain transition-colors shadow-sm"
              title="Export">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round"
                  stroke-linejoin="round" stroke-width="2"></path>
              </svg>
            </button>
          </div>
        </section>
      </div>
    </main>
    <!-- END: Workspace Area -->
    <!-- BEGIN: Global Status Bar -->
    <footer
      class="px-4 py-6 flex justify-between items-center text-[11px] text-slate-500 bg-slate-50 border-t border-outline-variant h-10">
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-1">
          <span class="font-bold text-slate-800">0</span>
          <span class="text-slate-400">Words</span>
        </div>
        <div class="h-3 w-px bg-slate-300"></div>
        <div class="flex items-center space-x-1">
          <span class="font-bold text-slate-800">0</span>
          <span class="text-slate-400">Characters</span>
        </div>
      
      </div>
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-1">
          <span class="font-bold text-slate-800">0</span>
          <span class="text-slate-400">Characters</span>
        </div>
        <div class="h-3 w-px bg-slate-300"></div>
        <div class="flex items-center space-x-1 text-primary">
          <span class="material-symbols-outlined !text-[14px]">check</span>
          <span class="font-bold">0</span>
          <span>Flagged</span>
        </div>
      </div>
    </footer>
    <!-- END: Global Status Bar -->
  </div>
  <!-- END: MainContainer -->
</body>

</html>
